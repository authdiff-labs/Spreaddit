name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check

  app-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spreddit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spreddit-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
